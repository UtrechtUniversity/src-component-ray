---
- name: Install a Ray head node or worker
  hosts: all
  vars:
    _ray_head_node: "{{ ray_head_node | default(false, true) | bool }}"
    _ray_head_node_address: "{{ ray_head_node_address | default('', true) }}"
    _ray_dashboard_port: "{{ ray_dashboard_port | default('8265', true) }}"
    _ray_client_server_port: "{{ ray_client_server_port | default('10001', true) }}"
    _ray_head_node_port: "{{ ray_head_node_port | default('6379', true) }}"
    _ray_env: "{{ ray_env | default('') }}"
    _ray_public_key: "{{ ray_public_key | default('') }}"
    _ray_fail_hard: "{{ ray_fail_hard | default(false, true) | bool }}"
    _ray_packages: "{{ ray_packages | default('default', true) | split(',') | map('trim') | list | join(',') }}"
    _ray_env_file: /home/ray/ray.env
    _ray_install: true # in the future make this optional, in case `ray cluster up` wants to install ray itself
    _ray_service_name: "ray_{{ _ray_head_node | ternary('head', 'worker') }}"
    gather_facts: false

  tasks:

    - name: User provisioning
      block:
        - name: Create user ray
          ansible.builtin.user:
            name: ray
            state: present

        - name: Setup ssh key
          when: (_ray_public_key | length) > 0
          ansible.posix.authorized_key:
            user: ray
            state: present
            key: "{{ _ray_public_key }}"

        - name: Allow ray user to control systemd service
          community.general.sudoers:
            name: ray-systemctl
            state: present
            user: ray
            nopassword: true
            commands:
              - /usr/bin/systemctl start {{ _ray_service_name}}.service
              - /usr/bin/systemctl restart {{ _ray_service_name}}.service
              - /usr/bin/systemctl stop {{ _ray_service_name}}.service

    - name: Find private network
      block:
        - name: Create find_ip script
          ansible.builtin.copy:
            src: find_private_ip.sh
            dest: /usr/local/bin/find_private_ip.sh
            owner: root
            group: root
            mode: "0655"

        - name: Test find network interface
          ansible.builtin.command:
            cmd: /usr/local/bin/find_private_ip.sh
          register: find_private_network

        - name: Fail if no private network
          when:
            - find_private_network.rc != 0
          ansible.builtin.fail:
            msg: "No private network found! Result of script: {{ find_private_network.stdout }}"

    - name: Create Ray env file
      ansible.builtin.template:
        src: ray.env.j2
        dest: "{{ _ray_env_file }}"
        owner: ray
        group: ray
        mode: "0600"

    - name: Install Ray
      when: _ray_install
      block:
        - name: Install Ray
          ansible.builtin.command: uv tool install "ray[{{ _ray_packages }}]"

        - name: Create Ray systemd service
          ansible.builtin.template:
            src: ray.service.j2
            dest: /etc/systemd/system/{{ _ray_service_name }}.service
            owner: ray
            group: ray
            mode: "0644"
          notify:
            - Start Ray systemd service
            - Fail if ray is not active

  handlers:

    - name: Start Ray systemd service
      ansible.builtin.systemd:
        name: "{{ _ray_service_name }}"
        state: started
        daemon_reload: true

    - name: Fail if ray is not active
      when: _ray_fail_hard
      become: true
      become_user: ray
      ansible.builtin.command: uv tool run ray status
      retries: 10
      delay: 5

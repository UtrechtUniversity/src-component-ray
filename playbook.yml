---
- name: Install a Ray head node or worker
  hosts: all
  vars:
    ray_head_node: false
    ray_worker_node: not ray_head_node
    ray_head_node_address: "" # if this is a worker node, what head node should we connect to?
    ray_head_node_command: |
    ray_dashboard_port: "8265"
    ray_client_server_port: "10001"
    ray_head_port: "6379"
    ray_env: {}
    gather_facts: false

  tasks:

    - name: Create user ray
      ansible.builtin.user:
        name: ray
        state: present

    - name: Discover private network interface
      set_fact:
        _private_iface: >-
          {{ ansible_facts.interfaces
            | map('extract', ansible_facts)
            | selectattr('ipv4', 'defined')
            | selectattr('ipv4.address', 'match', '^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.)')
            | map(attribute='device')
            | first }}

    - name: Set ray command (head node) # complete
      when: ray_head_none
      ansible.builtin.set_fact:
        _ray_cmd: uv run ray start --head --node-ip-address={{ _private_iface }} --port={{ ray_head_port }} --dashboard-host={{ __private_network }} --dashboard-port={{ ray_dashboard_port }} --ray-client-server-port={{ ray_client_server_port }}

    - name: Set ray command (worker node) # complete
      when: ray_worker_node
      ansible.builtin.set_fact:
        _ray_cmd: uv run ray start --address="{{ ray_head_node_address }}:{{ ray_head_port }}" --node-ip-address="{{ _private_iface }}"

    - name: Create Ray systemd service
      ansible.builtin.template:
        src: ray.service.j2
        dest: /etc/systemd/system/ray.service
        owner: ray
        group: ray
        mode: "0644"
      notify: Start Ray systemd service

    - name: Enable logrotation
      ansible.builtin.blockinfile:
        path: /etc/logrotate.d/ray
        block: >
          /var/log/ray/ {
            hourly
            rotate 5
            size 50M
            compress
            delaycompress
            missingok
            copytruncate
          }
        create: true
        mode: "0644"

  handlers:
    - name: Start Ray systemd service
      ansible.builtin.systemd:
      name: ray
      state: started

---
- name: Install a Ray head node or worker
  hosts: all
  vars:
    ray_head_node: false
    ray_worker_node: not ray_head_node
    ray_head_node_address: "" # if this is a worker node, what head node should we connect to?
    ray_dashboard_port: "8265"
    ray_client_server_port: "10001"
    ray_head_port: "6379"
    ray_env: {}
    gather_facts: false

  tasks:

    # todo add storage location
    # todo scan for head node?

    - name: Create user ray
      ansible.builtin.user:
        name: ray
        state: present

    - name: Create find_ip script
      ansible.builtin.copy:
        src: find_private_network.sh
        dest: /usr/local/bin/find_private_network.sh
        owner: root
        group: root
        mode: "0655"

    - name: Test find network interface
      ansible.builtin.command:
        cmd: /usr/local/bin/find_private_network.sh
      register: find_private_network

    - name: Fail if no private network
      when: find_private_network.rc != 0
      ansible.builtin.fail:
        msg: "No private network found! Result of script: {{ find_private_network.stdout }}"

    - name: Set ray command (head node)
      when: ray_head_none
      ansible.builtin.set_fact:
        _ray_cmd: uv run ray start --head --node-ip-address="$PRIVATE_NETWORK" --port={{ ray_head_port }} --dashboard-host={{ __private_network }} --dashboard-port={{ ray_dashboard_port }} --ray-client-server-port={{ ray_client_server_port }}

    - name: Set ray command (worker node)
      when: ray_worker_node
      ansible.builtin.set_fact:
        _ray_cmd: uv run ray start --address="{{ ray_head_node_address | default('$RAY_HEAD_NODE_ADDRESS', true) }}" --node-ip-address="$PRIVATE_NETWORK"

    - name: Create Ray systemd service
      ansible.builtin.template:
        src: ray.service.j2
        dest: /etc/systemd/system/ray.service
        owner: ray
        group: ray
        mode: "0644"
      notify: Start Ray systemd service

    - name: Enable logrotation
      ansible.builtin.blockinfile:
        path: /etc/logrotate.d/ray
        block: >
          /var/log/ray/ {
            hourly
            rotate 5
            size 50M
            compress
            delaycompress
            missingok
            copytruncate
          }
        create: true
        mode: "0644"

  handlers:
    - name: Start Ray systemd service
      ansible.builtin.systemd:
        name: ray
        state: started

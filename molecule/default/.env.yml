components:
  - name: head_node
    path: playbook.yml
    parameters:
      ray_head_node: 'true'
      ray_fail_hard: 'true'
  - name: worker_node
    path: playbook.yml
    parameters:
      ray_head_node: 'false'
      ray_fail_hard: 'true'
      ray_head_node_address: 'test-ray' # the name of the container

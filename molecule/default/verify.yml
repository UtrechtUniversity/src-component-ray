---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Copy test script
      ansible.builtin.copy:
        src: ../files/test.py
        dest: /home/ray/test.py
        owner: ray
        group: ray
        mode: "0655"
  
    - name: Test Ray job API
      ansible.builtin.command: /opt/ray_head-venv/bin/ray job submit --working-dir /home/ray/ --address test-ray:6379 -- python test.py
      timeout: 15
      register: test_job_output

    # - name: Test Ray client API
    #   ansible.builtin.command:
    #     cmd: /opt/ray_head-venv/bin/python /home/ray/test.py
    #   timeout: 15
    #   environment:
    #     RAY_ADDRESS: "ray://test-ray:10001" # use the name of the container
    #   register: test_client_output

    - name: Assert success
      ansible.builtin.assert:
        that:
          - '"Result: 16" in test_job_output.stdout'
          - '"Result: 16" in test_client_output.stdout'
